name: Release

on:
  workflow_dispatch:

jobs:
  validate:
    name: ✅ PR Checks
    uses: ./.github/workflows/pr-checks.yml
    secrets: inherit

  merge-develop:
    name: 🚀 Merge develop → main
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 🔄 Fetch latest changes
        run: |
          git fetch origin main
          git fetch origin develop

      - name: 🌿 Checkout main branch
        run: git checkout main

      - name: 🔀 Merge develop into main
        run: |
          if git merge-base origin/main origin/develop >/dev/null 2>&1; then
            git merge origin/develop --no-edit
          else
            echo "::notice title=Unrelated histories::main and develop share no merge base; merging with --allow-unrelated-histories (one-time for divergent roots)."
            git merge origin/develop --no-edit --allow-unrelated-histories
          fi
        env:
          GIT_MERGE_AUTOEDIT: no

      - name: 📤 Push merge to main
        run: git push origin main

  deploy-gate:
    name: 🛡️ Publish deploy gate
    runs-on: ubuntu-latest
    needs: merge-develop
    permissions:
      contents: read
      statuses: write
    steps:
      - name: 📥 Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: ✅ Publish release/build-validation for Vercel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse HEAD)
          gh api --method POST "repos/${{ github.repository }}/statuses/${SHA}" \
            -f "state=success" \
            -f context="release/build-validation" \
            -f description="Release: PR Checks passed; develop merged to main"
